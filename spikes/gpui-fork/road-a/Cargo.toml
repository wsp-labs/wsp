[package]
name = "road-a"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[lib]
path = "src/view.rs"

[dependencies]
gpui = { git = "https://github.com/zeronsh/zui", rev = "361ff20b919fdfb80199ee6d9aed725300cb7d54" }
gpui_platform = { git = "https://github.com/zeronsh/zui", rev = "361ff20b919fdfb80199ee6d9aed725300cb7d54", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui-component = { git = "https://github.com/longbridge/gpui-kit", rev = "ae30c2aa68230351b8bc0d5e08671c9359ee90b2" }

# gpui-kit at ae30c2aa names Zed's git repo; these swap every Zed crate it uses for zui at one commit.
# Keep Cargo.lock committed: resolving this patch without it clones all of Zed.
[patch."https://github.com/zed-industries/zed"]
gpui = { git = "https://github.com/zeronsh/zui", rev = "361ff20b919fdfb80199ee6d9aed725300cb7d54" }
gpui_platform = { git = "https://github.com/zeronsh/zui", rev = "361ff20b919fdfb80199ee6d9aed725300cb7d54" }
gpui_macros = { git = "https://github.com/zeronsh/zui", rev = "361ff20b919fdfb80199ee6d9aed725300cb7d54" }
gpui_web = { git = "https://github.com/zeronsh/zui", rev = "361ff20b919fdfb80199ee6d9aed725300cb7d54" }
