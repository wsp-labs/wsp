name: CI dependency diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install the real compiler dependencies
        run: bash scripts/ci-apt.sh musl-tools gperf
      - name: Verify the installed commands
        run: |
          musl-gcc --version
          gperf --version
