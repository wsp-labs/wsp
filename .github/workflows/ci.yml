name: CI network diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  network:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect resolver and mirror configuration
        run: |
          cat /etc/resolv.conf
          cat /etc/apt/apt-mirrors.txt
          cat /etc/apt/sources.list.d/ubuntu.sources
          python3 -c 'import os; print({k: bool(os.getenv(k)) for k in ["HTTP_PROXY", "HTTPS_PROXY", "ALL_PROXY", "http_proxy", "https_proxy"]})'
      - name: Resolve public hosts as the runner and apt
        run: |
          for host in archive.ubuntu.com security.ubuntu.com azure.archive.ubuntu.com packages.microsoft.com github.com; do
            echo "Resolver: $host"
            timeout 10 getent ahostsv4 "$host" || true
            echo "Apt resolver: $host"
            sudo -u _apt timeout 10 getent ahostsv4 "$host" || true
          done
      - name: Check HTTPS and independent DNS
        run: |
          for url in https://archive.ubuntu.com/ubuntu/dists/noble/InRelease https://security.ubuntu.com/ubuntu/dists/noble-security/InRelease; do
            curl --head --connect-timeout 5 --max-time 10 "$url" || true
          done
          curl --connect-timeout 5 --max-time 10 -H 'accept: application/dns-json' 'https://1.1.1.1/dns-query?name=archive.ubuntu.com&type=A' || true
