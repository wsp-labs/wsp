name: CI browser dependency verification
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: "11.9.0"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: build
          path: ${{ runner.temp }}
          run-id: "43052694176"
          github-token: ${{ github.token }}
      - run: tar -xf "$RUNNER_TEMP/build.tar"
      - name: Prepare Ubuntu package access
        run: bash scripts/ci-apt.sh
      - name: Chromium
        run: pnpm --filter @wsp/web exec playwright install --with-deps chromium
      - name: Render tests
        env:
          WSP_RENDER: "1"
        run: pnpm exec vitest run --minWorkers=1 --maxWorkers=2 apps/web/test/slate- apps/web/test/project-icon.browser.test.ts apps/web/test/resume-picker.browser.test.ts apps/web/test/composer-tray.browser.test.ts
