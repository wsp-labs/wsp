# SPDX-License-Identifier: AGPL-3.0-only
[package]
name = "wsp-machines"
version = "0.0.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false
description = "The machines area of the runtime: places, machines, images, and the usage and agent readings the machine roads take"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
futures = "0.3"
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = { version = "3", features = ["pkcs8"] }
thiserror = "2"
tokio = { version = "1", features = ["process", "time", "io-util", "fs", "net", "rt", "macros", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
wsp-adapters = { path = "../wsp-adapters" }
wsp-core = { path = "../wsp-core" }
wsp-catalog = { path = "../wsp-catalog" }
wsp-engine = { path = "../wsp-engine" }
wsp-store = { path = "../wsp-store" }
wsp-wire = { path = "../wsp-wire" }
wsp-words = { path = "../wsp-words" }
wsp-frames = { path = "../../../daemon/crates/wsp-frames" }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "test-util"] }
tokio-util = "0.7"

[lints.clippy]
result_large_err = "allow"
type_complexity = "allow"
arc_with_non_send_sync = "allow"
large_enum_variant = "allow"
too_many_arguments = "allow"
