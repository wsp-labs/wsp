# SPDX-License-Identifier: AGPL-3.0-only
[package]
name = "wsp-cli"
version = "0.0.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false
description = "The command line's verb table and what it reads: the verbs, the socket client, the hosts records, the lock and the help pages"

[dependencies]
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
wsp-wire = { path = "../wsp-wire" }
wsp-words = { path = "../wsp-words" }
wsp-catalog = { path = "../wsp-catalog" }
wsp-collect = { path = "../wsp-collect" }
wsp-store = { path = "../wsp-store" }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
async-trait = "0.1"
futures = "0.3"
regex = "1"
unicode-segmentation = "1"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
