# SPDX-License-Identifier: AGPL-3.0-only
[package]
name = "wsp-cli"
version = "0.0.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false
description = "The command line's verb table and what it reads: the verbs, the socket client, the hosts records, the lock and the help pages"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
futures = "0.3"
libc = "0.2"
regex = "1"
rand_core = { version = "0.6", features = ["getrandom"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time", "net", "io-util", "io-std"] }
tokio-tungstenite = "0.30"
unicode-segmentation = "1"
url = "2"
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
wsp-wire = { path = "../wsp-wire" }
wsp-words = { path = "../wsp-words" }
wsp-catalog = { path = "../wsp-catalog" }
wsp-collect = { path = "../wsp-collect" }
wsp-store = { path = "../wsp-store" }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
