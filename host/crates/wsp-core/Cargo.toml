# SPDX-License-Identifier: AGPL-3.0-only
[package]
name = "wsp-core"
version = "0.0.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false
description = "The host's core: the context and the types the runtime's areas share, the clock, status, the daemon channel, reach and the exec roads"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
futures = "0.3"
futures-util = "0.3"
hex = "0.4"
indexmap = { version = "2", features = ["serde"] }
libc = "0.2"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = ["process", "time", "io-util", "fs", "net", "rt", "rt-multi-thread", "macros", "sync"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake", "connect", "rustls-tls-webpki-roots"] }
# The provider the daemon workspace takes (daemon/Cargo.toml). tokio-tungstenite's feature turns none on, so the one
# provider rustls builds a client config from comes from tokio-rustls here, and the channel's own dial names it.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "0.26"
tokio-util = "0.7"
sha2 = "0.10"
url = "2"
jiff = "0.2"
wsp-frames = { path = "../../../daemon/crates/wsp-frames" }
wsp-wire = { path = "../wsp-wire" }
wsp-words = { path = "../wsp-words" }
wsp-store = { path = "../wsp-store" }
wsp-catalog = { path = "../wsp-catalog" }
wsp-collect = { path = "../wsp-collect" }
wsp-engine = { path = "../wsp-engine" }
wsp-adapters = { path = "../wsp-adapters" }

[lints.clippy]
result_large_err = "allow"
type_complexity = "allow"
arc_with_non_send_sync = "allow"

[dev-dependencies]
regex = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "test-util"] }
