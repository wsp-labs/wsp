# SPDX-License-Identifier: AGPL-3.0-only
[package]
name = "wsp-threads"
version = "0.0.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false
description = "The threads area of the runtime: sessions, turns, transcripts, forks, conversations and the activity feed"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
futures = "0.3"
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = ["process", "time", "io-util", "fs", "rt", "macros", "sync"] }
tokio-util = "0.7"
wsp-account = { path = "../wsp-account" }
wsp-machines = { path = "../wsp-machines" }
wsp-core = { path = "../wsp-core" }
wsp-adapters = { path = "../wsp-adapters" }
wsp-catalog = { path = "../wsp-catalog" }
wsp-engine = { path = "../wsp-engine" }
wsp-store = { path = "../wsp-store" }
wsp-wire = { path = "../wsp-wire" }
wsp-words = { path = "../wsp-words" }
wsp-frames = { path = "../../../daemon/crates/wsp-frames" }

[lints.clippy]
result_large_err = "allow"
type_complexity = "allow"
arc_with_non_send_sync = "allow"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "test-util"] }
