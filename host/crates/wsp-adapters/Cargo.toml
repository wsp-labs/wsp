# SPDX-License-Identifier: AGPL-3.0-only
[package]
name = "wsp-adapters"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false
description = "The four harness adapters: what each agent's command line prints, read into the events the runtime keeps"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
regex = "1"
uuid = { version = "1", features = ["v4"] }
wsp-frames = { path = "../../../daemon/crates/wsp-frames" }
wsp-wire = { path = "../wsp-wire" }
wsp-words = { path = "../wsp-words" }
wsp-catalog = { path = "../wsp-catalog" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time", "test-util"] }

# The host runs on one thread, so ports hand out Arc<dyn ..> that is not Send; the port's types are TS promises and callbacks.
[lints.clippy]
arc_with_non_send_sync = "allow"
type_complexity = "allow"
