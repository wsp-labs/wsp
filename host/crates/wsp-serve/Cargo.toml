# SPDX-License-Identifier: AGPL-3.0-only
[package]
name = "wsp-serve"
version = "0.0.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false
description = "The runtime's op switch and the assembly of its areas: serve.ts, serve-*.ts, runtime.ts and index.ts"

[lints.clippy]
result_large_err = "allow"
type_complexity = "allow"
large_enum_variant = "allow"
arc_with_non_send_sync = "allow"

[dependencies]
async-trait = "0.1"
futures = "0.3"
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = ["process", "time", "io-util", "fs", "net", "rt", "macros", "sync"] }
tokio-util = "0.7"
tokio-tungstenite = "0.30"
rand = "0.8"
base64 = "0.22"
hex = "0.4"
url = "2"
jiff = "0.2"
wsp-frames = { path = "../../../daemon/crates/wsp-frames" }
wsp-wire = { path = "../wsp-wire" }
wsp-words = { path = "../wsp-words" }
wsp-store = { path = "../wsp-store" }
wsp-catalog = { path = "../wsp-catalog" }
wsp-engine = { path = "../wsp-engine" }
wsp-adapters = { path = "../wsp-adapters" }
wsp-core = { path = "../wsp-core" }
wsp-machines = { path = "../wsp-machines" }
wsp-account = { path = "../wsp-account" }
wsp-threads = { path = "../wsp-threads" }
wsp-slates = { path = "../wsp-slates" }

[dev-dependencies]
base64 = "0.22"
async-trait = "0.1"
futures = "0.3"
tokio-tungstenite = "0.30"
jiff = "0.2"
tempfile = "3"
flate2 = "1"
tokio = { version = "1", features = ["rt-multi-thread", "test-util"] }
