<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="670" viewBox="0 0 1000 670" role="img" aria-label="A changing number used to redraw its ancestors; after the fix only the changed view redraws"><title>A changing number used to redraw its ancestors; after the fix only the changed view redraws</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="none" stroke="#aaa092" stroke-width="1.5"/></marker></defs><rect width="1000" height="670" rx="20" fill="#121110"/><g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><text x="40" y="42" fill="#f5b552" font-size="13" font-weight="600">WHY A TINY UPDATE BECAME EXPENSIVE</text><text x="40" y="87" fill="#ece6dc" font-size="29" font-weight="500">One number changes. How much gets redrawn?</text><text x="40" y="145" fill="#ef917e" font-size="24" font-weight="500">Before</text><rect x="75" y="170" width="330" height="64" rx="12" fill="#251b17" stroke="#ef917e"/><text x="95" y="210" fill="#ef917e" font-size="23" font-weight="500">Window</text><path d="M240 234 L240 275" fill="none" stroke="#ef917e" stroke-width="2"/><rect x="75" y="275" width="330" height="64" rx="12" fill="#251b17" stroke="#ef917e"/><text x="95" y="315" fill="#ef917e" font-size="23" font-weight="500">Settings</text><path d="M240 339 L240 380" fill="none" stroke="#ef917e" stroke-width="2"/><rect x="75" y="380" width="330" height="64" rx="12" fill="#251b17" stroke="#ef917e"/><text x="95" y="420" fill="#ef917e" font-size="23" font-weight="500">Activity</text><path d="M240 444 L240 485" fill="none" stroke="#ef917e" stroke-width="2"/><rect x="75" y="485" width="330" height="64" rx="12" fill="#251b17" stroke="#ef917e"/><text x="95" y="525" fill="#ef917e" font-size="23" font-weight="500">CPU number</text><path d="M425 520 V177" fill="none" stroke="#ef917e" stroke-width="2" marker-end="url(#arrow)"/><text x="75" y="600" fill="#ef917e" font-size="19" font-weight="400">Parents redraw too</text><text x="540" y="145" fill="#9cc7a3" font-size="24" font-weight="500">After</text><rect x="575" y="170" width="330" height="64" rx="12" fill="#1b1916" stroke="#766e64"/><text x="595" y="210" fill="#766e64" font-size="23" font-weight="500">Window</text><path d="M740 234 L740 275" fill="none" stroke="#39332b" stroke-width="2"/><rect x="575" y="275" width="330" height="64" rx="12" fill="#1b1916" stroke="#766e64"/><text x="595" y="315" fill="#766e64" font-size="23" font-weight="500">Settings</text><path d="M740 339 L740 380" fill="none" stroke="#39332b" stroke-width="2"/><rect x="575" y="380" width="330" height="64" rx="12" fill="#1b1916" stroke="#766e64"/><text x="595" y="420" fill="#766e64" font-size="23" font-weight="500">Activity</text><path d="M740 444 L740 485" fill="none" stroke="#39332b" stroke-width="2"/><rect x="575" y="485" width="330" height="64" rx="12" fill="#1b241c" stroke="#9cc7a3"/><text x="595" y="525" fill="#9cc7a3" font-size="23" font-weight="500">CPU number</text><text x="575" y="600" fill="#9cc7a3" font-size="19" font-weight="400">Only the changed piece redraws</text></g></svg>