<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc"><title id="title">Building WSP inside WSP, across my Mac and Boat computers</title><desc id="desc">On my Mac I give a lead Claude Code thread the direction. It starts builder threads on Boat computers with 8 cores and 16 GB each. Builders work on separate branches. A separate thread reviews their work and reports back to the lead. The lead brings approved changes together. I try the new app on my Mac and send feedback into the next round.</desc><defs><marker id="flow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#b2a798" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="back" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#f5b552" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1200" height="1200" rx="20" fill="#121110"/><g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><text x="600" y="52" text-anchor="middle" fill="#f5b552" font-size="15" font-weight="600">BUILT INSIDE WSP</text><text x="600" y="104" text-anchor="middle" fill="#ece6dc" font-size="36" font-weight="500">One app, built across several computers.</text><text x="600" y="143" text-anchor="middle" fill="#b2a798" font-size="21" font-weight="400">I steer it. A lead thread coordinates. Other threads build and review.</text><rect x="44" y="188" width="340" height="920" rx="18" fill="#171511" stroke="#302a23"/><rect x="424" y="188" width="732" height="920" rx="18" fill="#151411" stroke="#302a23"/><text x="214" y="230" text-anchor="middle" fill="#f5b552" font-size="16" font-weight="600">MY MAC</text><text x="790" y="230" text-anchor="middle" fill="#f5b552" font-size="16" font-weight="600">BOAT COMPUTERS</text><text x="790" y="269" text-anchor="middle" fill="#b2a798" font-size="20" font-weight="400">8 cores / 16 GB of memory per build computer</text><path d="M354 587 H447 V323 H1020" fill="none" stroke="#b2a798" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M560 323 V373" fill="none" stroke="#b2a798" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#flow)"/><path d="M790 323 V373" fill="none" stroke="#b2a798" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#flow)"/><path d="M1020 323 V373" fill="none" stroke="#b2a798" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#flow)"/><rect x="668" y="276" width="244" height="33" rx="6" fill="#171511" stroke="none"/><text x="790" y="298" text-anchor="middle" fill="#b2a798" font-size="18" font-weight="400">Starts builder threads</text><rect x="465" y="378" width="190" height="140" rx="14" fill="#1c1915" stroke="#443b30"/><text x="560" y="428.0" text-anchor="middle" fill="#ece6dc" font-size="25" font-weight="500">Builder thread</text><text x="560" y="460.0" text-anchor="middle" fill="#b2a798" font-size="19" font-weight="400">Settings + Usage</text><text x="560" y="487.0" text-anchor="middle" fill="#b2a798" font-size="19" font-weight="400">Own branch</text><rect x="695" y="378" width="190" height="140" rx="14" fill="#1c1915" stroke="#443b30"/><text x="790" y="428.0" text-anchor="middle" fill="#ece6dc" font-size="25" font-weight="500">Builder thread</text><text x="790" y="460.0" text-anchor="middle" fill="#b2a798" font-size="19" font-weight="400">Threads + sidebar</text><text x="790" y="487.0" text-anchor="middle" fill="#b2a798" font-size="19" font-weight="400">Own branch</text><rect x="925" y="378" width="190" height="140" rx="14" fill="#1c1915" stroke="#443b30"/><text x="1020" y="428.0" text-anchor="middle" fill="#ece6dc" font-size="25" font-weight="500">Builder thread</text><text x="1020" y="460.0" text-anchor="middle" fill="#b2a798" font-size="19" font-weight="400">Terminal + panels</text><text x="1020" y="487.0" text-anchor="middle" fill="#b2a798" font-size="19" font-weight="400">Own branch</text><path d="M560 523 V573 H790" fill="none" stroke="#b2a798" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M790 523 V573 H790" fill="none" stroke="#b2a798" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M1020 523 V573 H790" fill="none" stroke="#b2a798" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M790 573 V702" fill="none" stroke="#b2a798" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#flow)"/><rect x="695" y="623" width="190" height="33" rx="6" fill="#171511" stroke="none"/><text x="790" y="645" text-anchor="middle" fill="#b2a798" font-size="18" font-weight="400">Code + report</text><rect x="564" y="707" width="452" height="125" rx="14" fill="#1c1915" stroke="#443b30"/><text x="790" y="763.0" text-anchor="middle" fill="#ece6dc" font-size="25" font-weight="500">Separate review thread</text><text x="790" y="795.0" text-anchor="middle" fill="#b2a798" font-size="19" font-weight="400">Checks the changes and the evidence</text><path d="M564 770 H402 V638 H354" fill="none" stroke="#f5b552" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#back)"/><rect x="408.0" y="781" width="142" height="33" rx="6" fill="#171511" stroke="none"/><text x="479" y="803" text-anchor="middle" fill="#f5b552" font-size="18" font-weight="400">Report back</text><text x="790" y="894" text-anchor="middle" fill="#b2a798" font-size="20" font-weight="400">Found a problem? The lead sends it back.</text><text x="790" y="927" text-anchor="middle" fill="#b2a798" font-size="20" font-weight="400">The next build carries the fix.</text><rect x="482" y="989" width="616" height="70" rx="11" fill="#1b1915" stroke="#393127"/><text x="790" y="1018" text-anchor="middle" fill="#b2a798" font-size="19" font-weight="400">Repeated mistakes become skills and checks,</text><text x="790" y="1046" text-anchor="middle" fill="#b2a798" font-size="19" font-weight="400">so the next thread starts with what we learned.</text><rect x="74" y="280" width="280" height="114" rx="14" fill="#1c1915" stroke="#443b30"/><text x="214.0" y="317.0" text-anchor="middle" fill="#ece6dc" font-size="25" font-weight="500">Me</text><text x="214.0" y="349.0" text-anchor="middle" fill="#b2a798" font-size="19" font-weight="400">Sets the direction</text><text x="214.0" y="376.0" text-anchor="middle" fill="#b2a798" font-size="19" font-weight="400">Decides what feels right</text><path d="M214 394 V556" fill="none" stroke="#b2a798" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#flow)"/><rect x="104.0" y="456" width="220" height="33" rx="6" fill="#171511" stroke="none"/><text x="214" y="478" text-anchor="middle" fill="#b2a798" font-size="18" font-weight="400">Brief + references</text><rect x="74" y="560" width="280" height="132" rx="14" fill="#1c1915" stroke="#443b30"/><text x="214.0" y="606.0" text-anchor="middle" fill="#ece6dc" font-size="25" font-weight="500">Lead thread</text><text x="214.0" y="638.0" text-anchor="middle" fill="#b2a798" font-size="19" font-weight="400">Claude Code inside WSP</text><text x="214.0" y="665.0" text-anchor="middle" fill="#b2a798" font-size="19" font-weight="400">Keeps the plan; reads reports</text><path d="M214 692 V911" fill="none" stroke="#b2a798" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#flow)"/><rect x="86.0" y="782" width="256" height="33" rx="6" fill="#171511" stroke="none"/><text x="214" y="804" text-anchor="middle" fill="#b2a798" font-size="18" font-weight="400">Brings changes together</text><rect x="74" y="916" width="280" height="132" rx="14" fill="#1c1915" stroke="#443b30"/><text x="214.0" y="962.0" text-anchor="middle" fill="#ece6dc" font-size="25" font-weight="500">Try the new app</text><text x="214.0" y="994.0" text-anchor="middle" fill="#b2a798" font-size="19" font-weight="400">Compare it with Electron</text><text x="214.0" y="1021.0" text-anchor="middle" fill="#b2a798" font-size="19" font-weight="400">Check CPU and memory</text><path d="M74 979 H25 V337 H74" fill="none" stroke="#f5b552" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#back)"/><text transform="translate(43 660) rotate(-90)" text-anchor="middle" fill="#f5b552" font-size="17">My feedback, screenshots, and bug reports</text><text x="600" y="1161" text-anchor="middle" fill="#ece6dc" font-size="22" font-weight="500">Build → review → bring together → try it → send fixes back</text></g></svg>