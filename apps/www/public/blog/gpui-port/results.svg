<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-label="Results of the GPUI migration: memory, smaller downloads, and lower idle CPU"><title>Results of the GPUI migration: memory, smaller downloads, and lower idle CPU</title><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#f5b552" stroke-width="1.7"/></marker></defs><rect width="1200" height="740" rx="20" fill="#121110"/><g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><text x="60" y="54" text-anchor="start" fill="#f5b552" font-size="15" font-weight="600">WHAT WE GOT</text><text x="60" y="110" text-anchor="start" fill="#ece6dc" font-size="43" font-weight="500">A lighter app, built inside WSP.</text><rect x="60" y="158" width="510" height="222" rx="15" stroke="#443b30" fill="#1c1915"/><text x="315" y="198" text-anchor="middle" fill="#b2a798" font-size="22" font-weight="400">GPUI memory at rest</text><text x="315" y="267" text-anchor="middle" fill="#9cc7a3" font-size="49" font-weight="500">180 MiB</text><text x="315" y="313" text-anchor="middle" fill="#ece6dc" font-size="21" font-weight="400">Earlier Electron use reached ~1 GB.</text><text x="315" y="351" text-anchor="middle" fill="#b2a798" font-size="17" font-weight="400">Same test: 438 → 180 MiB.</text><rect x="630" y="158" width="510" height="222" rx="15" stroke="#443b30" fill="#1c1915"/><text x="885" y="198" text-anchor="middle" fill="#b2a798" font-size="22" font-weight="400">Mac download</text><text x="885" y="267" text-anchor="middle" fill="#9cc7a3" font-size="49" font-weight="500">31% smaller</text><text x="885" y="313" text-anchor="middle" fill="#ece6dc" font-size="21" font-weight="400">225 → 154 MiB</text><text x="885" y="351" text-anchor="middle" fill="#b2a798" font-size="17" font-weight="400">Electron → GPUI / release 0.3.9</text><rect x="60" y="416" width="510" height="222" rx="15" stroke="#443b30" fill="#1c1915"/><text x="315" y="456" text-anchor="middle" fill="#b2a798" font-size="22" font-weight="400">Linux download</text><text x="315" y="525" text-anchor="middle" fill="#9cc7a3" font-size="49" font-weight="500">15% smaller</text><text x="315" y="571" text-anchor="middle" fill="#ece6dc" font-size="21" font-weight="400">127 → 108 MiB</text><text x="315" y="609" text-anchor="middle" fill="#b2a798" font-size="17" font-weight="400">Electron → GPUI / release 0.3.9</text><rect x="630" y="416" width="510" height="222" rx="15" stroke="#443b30" fill="#1c1915"/><text x="885" y="456" text-anchor="middle" fill="#b2a798" font-size="22" font-weight="400">Activity page CPU</text><text x="885" y="525" text-anchor="middle" fill="#9cc7a3" font-size="49" font-weight="500">1.7%</text><text x="885" y="571" text-anchor="middle" fill="#ece6dc" font-size="21" font-weight="400">Down from 20.6% after the fixes.</text><text x="885" y="609" text-anchor="middle" fill="#b2a798" font-size="17" font-weight="400">GPUI before → after redraw fixes</text><text x="600" y="707" text-anchor="middle" fill="#b2a798" font-size="18" font-weight="400">October 2026 app measurements and published 0.3.9 downloads.</text></g></svg>