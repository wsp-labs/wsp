<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>How a box's turns dial back after a blip</title>
<style>
  body { font: 13px/1.5 var(--font-sans); color: var(--foreground); }
  .wrap { display: flex; flex-direction: column; gap: 10px; padding: 2px 0 4px; }
  .controls { display: grid; grid-template-columns: auto 1fr auto; gap: 6px 10px; align-items: center; font-size: 12px; color: var(--muted-foreground); }
  .controls output { font: 12px var(--font-mono); color: var(--foreground); min-width: 4.5ch; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--slate-accent); }
  .switch { display: flex; gap: 6px; }
  button { font: 12px var(--font-sans); color: var(--muted-foreground); background: transparent; border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px; cursor: pointer; }
  button[aria-pressed="true"] { color: var(--foreground); border-color: var(--slate-accent); }
  svg { display: block; width: 100%; height: auto; overflow: visible; }
  .axis { stroke: var(--border); stroke-width: 1; }
  .tick { font: 10px var(--font-mono); fill: var(--muted-foreground); }
  .gone { fill: color-mix(in oklab, var(--error-foreground) 14%, transparent); }
  .gone-edge { stroke: var(--error-foreground); stroke-width: 1; stroke-dasharray: 2 3; }
  .cut { stroke: var(--muted-foreground); stroke-width: 1; }
  .row { stroke: var(--border); stroke-width: 1; stroke-dasharray: 1 4; }
  .miss { fill: none; stroke: var(--muted-foreground); stroke-width: 1.2; }
  .hit { fill: var(--slate-accent); }
  .lost { fill: var(--error-foreground); }
  .label { font: 10px var(--font-sans); fill: var(--muted-foreground); }
  .say { min-height: 3em; }
  .say b { font-weight: 500; }
  code { font: 12px var(--font-mono); }
</style>
</head>
<body>
<div class="wrap">
  <div class="controls">
    <label for="gone">Daemon gone for</label><input id="gone" type="range" min="1" max="70" step="1" value="12"><output for="gone"></output>
    <label for="turns">Turns on the box</label><input id="turns" type="range" min="1" max="8" step="1" value="6"><output for="turns"></output>
  </div>
  <div class="switch" role="group" aria-label="Jitter"><button data-jitter="on">With jitter, as shipped</button><button data-jitter="off">Without jitter</button></div>
  <svg role="img" aria-label="Each turn's dials over the first 65 seconds after the link drops"></svg>
  <div class="say" aria-live="polite"></div>
</div>
<script>
  const WINDOW = 60000, VIEW = 65000;
  const wait = (n, jitter) => Math.min(10000, 500 * 2 ** Math.max(0, n - 1)) + Math.floor(jitter * 250);
  const seeded = seed => () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const svg = document.querySelector("svg"), say = document.querySelector(".say");
  const gone = document.getElementById("gone"), turns = document.getElementById("turns");
  let jitter = true;
  const T = 14, B = 178;
  let L = 56, R = 548;
  const x = ms => L + (ms / VIEW) * (R - L);
  const el = (name, attrs, text) => { const e = document.createElementNS("http://www.w3.org/2000/svg", name); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); if (text !== undefined) e.textContent = text; return e; };
  /** Each turn's dials: when each fires, and whether the daemon answered it. A turn stops dialling at the 60 s window. */
  function dialsOf(turn, back) {
    const rand = seeded(7919 * (turn + 1));
    const out = [];
    let at = 0;
    for (let n = 1; ; n++) {
      at += wait(n, jitter ? rand() : 0);
      if (at >= WINDOW) return { out, back: undefined };
      const hit = at >= back;
      out.push({ at, hit });
      if (hit) return { out, back: at };
    }
  }
  function draw() {
    const W = Math.round(svg.getBoundingClientRect().width) || 560;
    L = W < 460 ? 46 : 56; R = W - 12;
    svg.setAttribute("viewBox", `0 0 ${W} 200`);
    svg.setAttribute("height", 200);
    const back = Number(gone.value) * 1000, n = Number(turns.value);
    gone.nextElementSibling.textContent = `${gone.value} s`;
    turns.nextElementSibling.textContent = String(n);
    svg.replaceChildren();
    svg.append(el("rect", { class: "gone", x: L, y: T - 6, width: Math.max(0, x(Math.min(back, VIEW)) - L), height: B - T + 6 }));
    if (back < VIEW) svg.append(el("line", { class: "gone-edge", x1: x(back), x2: x(back), y1: T - 6, y2: B }));
    svg.append(el("line", { class: "cut", x1: x(WINDOW), x2: x(WINDOW), y1: T - 6, y2: B }));
    svg.append(el("text", { class: "label", x: x(WINDOW) - 4, y: T - 8, "text-anchor": "end" }, "60 s: turn cut"));
    svg.append(el("line", { class: "axis", x1: L, x2: R, y1: B, y2: B }));
    for (let s = 0; s <= 60; s += R - L < 380 ? 20 : 10) { svg.append(el("line", { class: "axis", x1: x(s * 1000), x2: x(s * 1000), y1: B, y2: B + 4 })); svg.append(el("text", { class: "tick", x: x(s * 1000), y: B + 16, "text-anchor": "middle" }, `${s} s`)); }
    const gap = (B - T - 8) / Math.max(n, 1), ends = [];
    let dials = 0;
    for (let t = 0; t < n; t++) {
      const y = T + 4 + gap * (t + 0.5);
      svg.append(el("text", { class: "label", x: L - 8, y: y + 3.5, "text-anchor": "end" }, `turn ${t + 1}`));
      svg.append(el("line", { class: "row", x1: L, x2: R, y1: y, y2: y }));
      const d = dialsOf(t, back);
      dials += d.out.length;
      ends.push(d.back);
      for (const p of d.out) svg.append(p.hit ? el("circle", { class: "hit", cx: x(p.at), cy: y, r: 4.2 }) : el("circle", { class: "miss", cx: x(p.at), cy: y, r: 3 }));
      if (d.back === undefined) svg.append(el("circle", { class: "lost", cx: x(WINDOW), cy: y, r: 4.2 }));
    }
    const got = ends.filter(e => e !== undefined);
    const s1 = ms => `${(ms / 1000).toFixed(1)} s`;
    if (got.length === 0) say.innerHTML = `Gone ${gone.value} s is past the <b>60 s window</b>: all ${n} turns stop dialling and are cut, after ${dials} dials.`;
    else {
      const first = Math.min(...got), last = Math.max(...got), spread = last - first;
      say.innerHTML = `All ${n} back between <b>${s1(first)}</b> and <b>${s1(last)}</b>, ${s1(first - back)} after the daemon, in ${dials} dials. ` + (spread === 0 ? `With no jitter they all land in the <b>same instant</b>, on a daemon that just came back.` : `Jitter spreads them over <b>${spread} ms</b>.`);
    }
    document.querySelectorAll("[data-jitter]").forEach(b => b.setAttribute("aria-pressed", String((b.dataset.jitter === "on") === jitter)));
  }
  gone.oninput = draw; turns.oninput = draw;
  document.querySelectorAll("[data-jitter]").forEach(b => (b.onclick = () => { jitter = b.dataset.jitter === "on"; draw(); }));
  new ResizeObserver(draw).observe(document.documentElement);
  draw();
</script>
</body>
</html>
