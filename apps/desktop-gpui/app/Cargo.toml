# SPDX-License-Identifier: AGPL-3.0-only
[package]
name = "desktop-gpui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "wsp's desktop app on GPUI"

[dependencies]
# tree-sitter-languages turns on syntax highlighting in markdown's fenced code.
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "14f59330a4aa0cb5becf140e067d64a616328612", features = ["tree-sitter-languages"] }
wsp-host-client = { path = "../host-client" }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures = "0.3"
# The dither is rasterised once into an image GPUI draws, and its polylines need round joins and caps.
image = { version = "0.25", default-features = false, features = ["gif"] }
# The engine today's pane runs as wasm; it builds Ghostty with Zig (scripts/ghostty.sh).
libghostty-vt = { git = "https://github.com/Uzaaft/libghostty-rs", rev = "d2036baeb605d31d09a9e2ba6d0c923e04c34d54", default-features = false }
libc = "0.2"
lyon = "1.0"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
# A link's domain read as a browser reads the address, as the web's slateLinkDomain does with URL.
url = "2"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
# The browser pane's page: WKWebView on the Mac, WebKitGTK on Linux, as a child of GPUI's window. 0.53 is the last
# release on webkit2gtk 2.0.1, which the pane was proven on.
wry = { version = "=0.53.5", default-features = false, features = ["os-webview", "x11"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
gdkx11 = "0.18"
webkit2gtk = "=2.0.1"
# SHAPE cuts GPUI's overlays out of the page's window; XTEST drives `--screen browser`'s checks through the server.
x11rb = { version = "0.13", features = ["shape", "xtest"] }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"
objc2 = "0.6"
raw-window-handle = "0.6"

[dev-dependencies]
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "14f59330a4aa0cb5becf140e067d64a616328612", features = ["test-support"] }
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"
tempfile = "3"

[[test]]
name = "pixels"
harness = false

[[test]]
name = "effects"
harness = false

[[test]]
name = "gallery"
harness = false

[[test]]
name = "composer_shots"
harness = false

[[test]]
name = "slate_shots"
harness = false

[[test]]
name = "text"
harness = false

[[test]]
name = "terminal_shots"
harness = false

[[test]]
name = "dialogs_shots"
harness = false

[[test]]
name = "plot_dot"
harness = false

[[test]]
name = "pr_diff_shots"
harness = false

[[test]]
name = "pr_diff_scroll"
harness = false

[lints.rust]
# objc's msg_send! tests a cargo-clippy feature inside this crate.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }
