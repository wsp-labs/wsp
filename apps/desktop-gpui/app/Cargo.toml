# SPDX-License-Identifier: AGPL-3.0-only
[package]
name = "desktop-gpui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "wsp's desktop app on GPUI"

[dependencies]
gpui = { git = "https://github.com/zeronsh/zui", rev = "361ff20b919fdfb80199ee6d9aed725300cb7d54" }
# runtime_shaders compiles Metal shaders at launch, so a macOS build needs no Xcode Metal toolchain.
gpui_platform = { git = "https://github.com/zeronsh/zui", rev = "361ff20b919fdfb80199ee6d9aed725300cb7d54", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
# tree-sitter-languages turns on syntax highlighting in markdown's fenced code.
gpui-component = { git = "https://github.com/longbridge/gpui-kit", rev = "ae30c2aa68230351b8bc0d5e08671c9359ee90b2", features = ["tree-sitter-languages"] }
wsp-host-client = { path = "../host-client" }
futures = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
gpui = { git = "https://github.com/zeronsh/zui", rev = "361ff20b919fdfb80199ee6d9aed725300cb7d54", features = ["test-support"] }
