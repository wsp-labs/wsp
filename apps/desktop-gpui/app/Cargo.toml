# SPDX-License-Identifier: AGPL-3.0-only
[package]
name = "desktop-gpui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "wsp's desktop app on GPUI"

[dependencies]
# tree-sitter-languages turns on syntax highlighting in markdown's fenced code.
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "14f59330a4aa0cb5becf140e067d64a616328612", features = ["tree-sitter-languages"] }
wsp-host-client = { path = "../host-client" }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures = "0.3"
# Names sort as the web's localeCompare sorts them, by the same Unicode collation.
icu_collator = "2.3"
# The dither is rasterised once into an image GPUI draws, and its polylines need round joins and caps; a project's icon
# is decoded from the formats the web takes.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
# The engine today's pane runs as wasm; it builds Ghostty with Zig (scripts/ghostty.sh).
libghostty-vt = { git = "https://github.com/Uzaaft/libghostty-rs", rev = "d2036baeb605d31d09a9e2ba6d0c923e04c34d54", default-features = false }
libc = "0.2"
lyon = "1.0"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"] }
# A link's domain read as a browser reads the address, as the web's slateLinkDomain does with URL.
url = "2"
# The heap-profile feature's sampled call stacks (src/heap.rs); off in every build the app ships.
backtrace = { version = "0.3", optional = true }

[features]
# A counting, sampling allocator for memory readings (src/heap.rs, bench/session.sh), off by default.
heap-profile = ["dep:backtrace"]

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
# The browser pane's page: WKWebView on the Mac, WebKitGTK on Linux, as a child of GPUI's window. 0.53 is the last
# release on webkit2gtk 2.0.1, which the pane was proven on.
wry = { version = "=0.53.5", default-features = false, features = ["os-webview", "x11"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
gdkx11 = "0.18"
webkit2gtk = "=2.0.1"
# SHAPE cuts GPUI's overlays out of the page's window; XTEST drives `--screen browser`'s checks through the server.
x11rb = { version = "0.13", features = ["shape", "xtest"] }

[target.'cfg(target_os = "macos")'.dependencies]
# The completion WebKit calls once the browser pane's store has cleared its service workers.
block2 = "0.6"
cocoa = "0.26"
objc = "0.2"
raw-window-handle = "0.6"
# The menu bar item, the Dock's badge and bounce, and the Quit and Move alerts, on macOS alone.
muda = { version = "0.21", default-features = false }
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSAlert",
    "NSApplication",
    "NSButton",
    "NSCell",
    "NSControl",
    "NSDockTile",
    "NSGraphics",
    "NSImage",
    "NSResponder",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSView",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSBundle",
    "NSData",
    "NSError",
    "NSFileManager",
    "NSGeometry",
    "NSString",
    "NSURL",
] }
tray-icon = { version = "0.26", default-features = false }

[dev-dependencies]
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "14f59330a4aa0cb5becf140e067d64a616328612", features = ["test-support"] }
libc = "0.2"
tempfile = "3"
# A fake host on the lock's port, for the feed's reads of rows the record does not know.
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
ring = "0.17"
tokio = { version = "1", features = ["net", "io-util"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
wsp-frames = { path = "../../../daemon/crates/wsp-frames" }

