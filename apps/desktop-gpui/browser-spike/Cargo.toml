# SPDX-License-Identifier: AGPL-3.0-only
[package]
name = "browser-spike"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Spike: a native web view in the right panel with GPUI drawing above it, one road per feature"

# wry (default) is wry on our patched gpui-pre; kit is gpui-kit's webview on GPUI Fast, built only by road1.sh.
[features]
default = ["wry"]
wry = ["dep:wry", "dep:gtk", "dep:gdkx11", "dep:x11rb"]
kit = ["dep:gpui-webview", "dep:lb-wry"]

[dependencies]
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "14f59330a4aa0cb5becf140e067d64a616328612" }
gpui-webview = { path = "../vendor/gpui-kit-14f5933/crates/webview", optional = true }
lb-wry = { version = "0.53.3", optional = true }
wry = { version = "=0.53.5", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }
gdkx11 = { version = "0.18", optional = true }
x11rb = { version = "0.13", features = ["shape"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"
objc2 = "0.6"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }
