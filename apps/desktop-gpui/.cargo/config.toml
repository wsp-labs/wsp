# Named for Ghostty's commit: libghostty-vt-sys rebuilds when this value changes, never when the folder's files do.
[env]
GHOSTTY_SOURCE_DIR = { value = "vendor/ghostty-3425025e585a3403340d4dc6d65132f42e05e605", relative = true }
# Zig's Debug build of it carries 256 KiB of thread-local data, which glibc takes from every thread's 2 MiB stack.
LIBGHOSTTY_VT_SYS_OPTIMIZE = "ReleaseFast"
