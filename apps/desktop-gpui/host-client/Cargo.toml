[package]
name = "wsp-host-client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The desktop app's road to the host: dial it as wsp does, list projects and threads, follow one thread live"

[dependencies]
wsp-mcp = { path = "../../../daemon/crates/wsp-mcp" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
ring = "0.17"
rusqlite = { version = "0.41", features = ["bundled"] }
tokio = { version = "1", features = ["rt", "sync", "process", "time", "net", "io-util"] }

[dev-dependencies]
libc = "0.2"
tokio = { version = "1", features = ["macros", "rt", "process", "time"] }
tempfile = "3"
# A fake host on the lock's port, for the release rule and the checks the token waits on.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

# build.rs generates the protocol's types from record/protocol.json, opened to a newer host's values and fields.
[build-dependencies]
typify = { version = "0.8", default-features = false }
schemars = "0.8"
serde_json = "1"
syn = { version = "3", features = ["full"] }
quote = "1"
