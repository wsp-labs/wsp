# SPDX-License-Identifier: AGPL-3.0-only
# The desktop app's own workspace, apart from daemon/'s, so GPUI's dependency tree never moves daemon/Cargo.lock.
[workspace]
resolver = "2"
members = ["host-client", "app"]
# gpui-kit's crates in vendor/ inherit from gpui-kit's own root manifest beside them, not this one.
exclude = ["vendor/gpui-kit-14f5933"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

# Backdrop blur and rounded clipping of children, our patches over gpui-kit's pinned gpui-pre. vendor/ is generated:
# run scripts/gpui-patches.sh apply after a fresh clone, and save after editing it.
[patch.crates-io]
gpui-pre = { path = "vendor/gpui-pre-0.3.9" }
gpui-pre-wgpu = { path = "vendor/gpui-pre-wgpu-0.3.9" }
gpui-pre-apple = { path = "vendor/gpui-pre-apple-0.3.9" }

# The markdown view's list markers and spacing, task boxes, code block and table chrome: our patch over gpui-kit's
# pinned gpui-base, applied in vendor/ by scripts/gpui-patches.sh like the gpui-pre ones.
[patch."https://github.com/longbridge/gpui-kit"]
gpui-base = { path = "vendor/gpui-kit-14f5933/crates/base" }
